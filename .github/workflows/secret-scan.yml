name: Secret scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Look for committed credentials
        run: |
          # Patterns for the credential shapes this project handles:
          #  - Ramblers volunteer API key: 32 hex characters after api-key=
          #  - Joomla web services token: base64 of "sha256:<user id>:<secret>"
          #  - a non-empty `token` literal in an #__ra_api_sites INSERT
          FOUND=0

          if grep -rInE "api-key=[0-9a-f]{32}" --include='*.php' --include='*.sql' \
               --include='*.xml' --include='*.js' --include='*.json' --include='*.md' .; then
            echo "::error::Hard-coded Ramblers API key found. Read it from #__ra_api_sites via ToolsHelper::lookupApiKey()."
            FOUND=1
          fi

          if grep -rIn "c2hhMjU2O" --include='*.php' --include='*.sql' \
               --include='*.xml' --include='*.js' --include='*.json' --include='*.md' .; then
            echo "::error::Base64-encoded Joomla API token (sha256:<id>:<secret>) found in the tree."
            FOUND=1
          fi

          if grep -rIn -A4 "INSERT INTO \`#__ra_api_sites\`" --include='*.php' --include='*.sql' . \
               | grep -E "'(https?://[^']+)', *'[^']+'"; then
            echo "::error::An #__ra_api_sites seed row carries a non-empty token. Ship these rows blank."
            FOUND=1
          fi

          if [ "$FOUND" -ne 0 ]; then
            exit 1
          fi
          echo "No committed credentials found."
